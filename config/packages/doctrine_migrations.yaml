doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MariaDB commits schema changes (DDL statements) implicitly, so wrapping migrations in a transaction doesn't make
    # them atomic, but leaves the connection in an inconsistent transaction state. With this setting, generated
    # migrations override isTransactional() to return false. Migrations which only change data may return true instead.
    transactional: false
