# /etc/dovecot/local.conf (Dovecot 2.3)

# Search for everything in square brackets. Replace those with the actual values for your setup.

# Core Settings
listen = [IP4], [IP6]

# TLS Configuration
ssl = required
ssl_cert = </etc/letsencrypt/live/[DOMAIN]/fullchain.pem
ssl_key = </etc/letsencrypt/live/[DOMAIN]/privkey.pem
ssl_dh = </etc/letsencrypt/ssl-dhparams.pem
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
ssl_prefer_server_ciphers = no

# Dovecot Services
service imap-login {
    inet_listener imap {
        port = 143
    }
}

service managesieve-login {
    inet_listener sieve {
        port = 4190
    }
}

service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0660
        user = postfix
        group = postfix
    }
    user = vmail
}

service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = postfix
        group = postfix
    }
    unix_listener auth-userdb {
        mode = 0660
        user = vmail
        group = vmail
    }
}

# Protocol Settings
protocol imap {
    mail_plugins = $mail_plugins quota imap_quota imap_sieve
    mail_max_userip_connections = 20
    imap_idle_notify_interval = 25 mins
}

protocol lmtp {
    mail_plugins = $mail_plugins sieve notify push_notification
    postmaster_address = [POSTMASTER_EMAIL]
}

# Client Authentication
first_valid_uid = [FIRST_VALID_UID]
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu

passdb {
    driver = sql
    args = /etc/dovecot/local-sql.conf.ext
}
userdb {
    driver = prefetch
}
userdb {
    driver = sql
    args = /etc/dovecot/local-sql.conf.ext
}

# Address Tagging
recipient_delimiter = +

# Mail Location
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail
mail_home = /var/mail/virtual/%d/%n
mail_location = maildir:~/mailbox

# Mailbox Configuration
namespace inbox {
    separator = .
    prefix = INBOX.
    inbox = yes
    mailbox Junk {
        auto = subscribe
        special_use = \Junk
    }
    mailbox Trash {
        auto = subscribe
        special_use = \Trash
    }
    mailbox Drafts {
        auto = subscribe
        special_use = \Drafts
    }
    mailbox Sent {
        auto = subscribe
        special_use = \Sent
    }
}

# Mail Plugins
plugin {
    sieve_plugins = sieve_imapsieve sieve_extprograms
    sieve_before = /var/mail/virtual/default/sieve/spam-global.sieve
    sieve = file:/var/mail/virtual/%d/%n/sieve;active=/var/mail/virtual/%d/%n/active-script.sieve
    sieve_vacation_min_period = 1d
    sieve_vacation_max_period = 0
    sieve_vacation_default_period = 7d
    sieve_vacation_send_from_recipient = yes

    # Spam Training
    imapsieve_mailbox1_name = Junk
    imapsieve_mailbox1_causes = COPY
    imapsieve_mailbox1_before = file:/var/mail/virtual/default/sieve/learn-spam.sieve

    imapsieve_mailbox2_name = *
    imapsieve_mailbox2_from = Junk
    imapsieve_mailbox2_causes = COPY
    imapsieve_mailbox2_before = file:/var/mail/virtual/default/sieve/learn-ham.sieve

    sieve_pipe_bin_dir = /usr/bin
    sieve_global_extensions = +vnd.dovecot.pipe

    quota = maildir:User quota
    quota_exceeded_message = Quota for user %u exceeded.
}

# Disable Debug Logging
auth_verbose = no
auth_verbose_passwords = no
auth_debug = no
auth_debug_passwords = no
mail_debug = no
verbose_ssl = no
log_debug =
