# /etc/dovecot/local.conf (Dovecot 2.4)

# Search for everything in square brackets. Replace those with the actual values for your setup.
# This file contains the database password, so make sure only root can read it (chmod 600).

# Core Settings
listen = [IP4], [IP6]

# TLS Configuration
ssl = required
ssl_server_cert_file = /etc/letsencrypt/live/[DOMAIN]/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/[DOMAIN]/privkey.pem
ssl_server_dh_file = /etc/letsencrypt/ssl-dhparams.pem
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
ssl_server_prefer_ciphers = client

# Dovecot Services
service imap-login {
    inet_listener imap {
        port = 143
    }
}

service managesieve-login {
    inet_listener sieve {
        port = 4190
    }
}

service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0660
        user = postfix
        group = postfix
    }
}

service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0660
        user = postfix
        group = postfix
    }
    unix_listener auth-userdb {
        mode = 0660
        user = vmail
        group = vmail
    }
}

# Protocol Settings
mail_plugins {
    quota = yes
}

protocol imap {
    mail_plugins {
        imap_quota = yes
        imap_sieve = yes
    }
    mail_max_userip_connections = 20
    imap_idle_notify_interval = 25 mins
}

protocol lmtp {
    mail_plugins {
        sieve = yes
    }
    postmaster_address = [POSTMASTER_EMAIL]
    # Debian strips the domain for LMTP by default, but the user database needs the full address.
    auth_username_format = %{user | lower}
}

# Client Authentication
first_valid_uid = [FIRST_VALID_UID]
auth_allow_cleartext = no
auth_mechanisms = plain login
auth_username_format = %{user | lower}

# Database Connection
sql_driver = mysql
mysql 127.0.0.1 {
    user = vmail
    password = [PASSWORD]
    dbname = vmail
}

# Database Queries
# Mailboxes can log in everywhere, send-only addresses only for sending emails (via Postfix).
passdb sql {
    default_password_scheme = BLF-CRYPT
    query = SELECT username, domain, password, CONCAT(quota, 'M') AS userdb_quota_storage_size \
        FROM accounts \
        WHERE username = '%{user | username}' AND domain = '%{user | domain}' AND password IS NOT NULL AND enabled = true \
        AND (type = 'mailbox' OR (type = 'sendonly' AND '%{protocol}' = 'smtp'))
}

userdb prefetch {
}

userdb sql {
    query = SELECT CONCAT(quota, 'M') AS quota_storage_size \
        FROM accounts \
        WHERE username = '%{user | username}' AND domain = '%{user | domain}' AND type = 'mailbox' AND enabled = true
    iterate_query = SELECT username, domain FROM accounts WHERE type = 'mailbox' AND enabled = true
}

# Address Tagging
recipient_delimiter = +

# Mail Location
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail
mail_home = /var/mail/virtual/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/mailbox

# Mailbox Configuration
namespace inbox {
    separator = .
    prefix = INBOX.
    inbox = yes
    mailbox Junk {
        auto = subscribe
        special_use = \Junk
        # Spam Training (OPTIONAL, requires Rspamd)
        sieve_script learn-spam {
            type = before
            cause = copy
            path = /var/mail/virtual/default/sieve/learn-spam.sieve
        }
    }
    mailbox Trash {
        auto = subscribe
        special_use = \Trash
    }
    mailbox Drafts {
        auto = subscribe
        special_use = \Drafts
    }
    mailbox Sent {
        auto = subscribe
        special_use = \Sent
    }
}

# Quota (0 means unlimited)
quota "User quota" {
    driver = maildir
}
quota_exceeded_message = Quota for user %{user} exceeded.

# Sieve
sieve_plugins {
    sieve_imapsieve = yes
    sieve_extprograms = yes
}
sieve_global_extensions {
    vnd.dovecot.pipe = yes
}
sieve_pipe_bin_dir = /usr/bin

sieve_script spam-global {
    type = before
    path = /var/mail/virtual/default/sieve/spam-global.sieve
}
sieve_script personal {
    type = personal
    path = /var/mail/virtual/%{user | domain}/%{user | username}/sieve
    active_path = /var/mail/virtual/%{user | domain}/%{user | username}/active-script.sieve
}

sieve_vacation_min_period = 1d
sieve_vacation_default_period = 7d
sieve_vacation_send_from_recipient = yes

# Spam Training (OPTIONAL, requires Rspamd)
imapsieve_from Junk {
    sieve_script learn-ham {
        type = before
        cause = copy
        path = /var/mail/virtual/default/sieve/learn-ham.sieve
    }
}
