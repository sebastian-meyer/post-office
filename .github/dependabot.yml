version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # Stay on Symfony 7.4 LTS. Dependabot doesn't respect Flex's "extra.symfony.require", so it would otherwise update
      # single components to 8.x. Remove this when upgrading to Symfony 8.
      - dependency-name: "symfony/*"
        versions: [ ">=8.0" ]
    groups:
      # Symfony UX packages are released together and have to be updated in lockstep.
      symfony-ux:
        patterns:
          - "symfony/ux-*"
          - "symfony/stimulus-bundle"
    assignees:
      - "sebastian-meyer"
    labels: [ ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "sebastian-meyer"
    labels: [ ]
