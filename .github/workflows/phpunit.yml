name: PHPUnit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  PHPUnit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Overrides the DDEV database host of .env.test ("_test" is appended to the database name in the test environment).
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/db?serverVersion=11.8.0-MariaDB&charset=utf8mb4"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_mysql
          coverage: none
          tools: composer

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress

      - name: Create Test Database
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Run PHPUnit
        run: vendor/bin/phpunit
