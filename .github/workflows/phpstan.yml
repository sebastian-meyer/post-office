name: PHP Static Analyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Build the dev cache (e.g. the service container XML used by the static analyzers).
  APP_ENV: dev

jobs:
  PHPStan:
    name: PHPStan Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl
          coverage: none
          tools: composer

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPStan
        run: composer phpstan:check
