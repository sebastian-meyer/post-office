name: PHP Mess Detector

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Build the dev cache (e.g. the service container XML used by the static analyzers).
  APP_ENV: dev

jobs:
  PHPMD:
    name: PHPMD Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl
          coverage: none
          tools: composer

      - name: Install Dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHP Mess Detector
        run: vendor/bin/phpmd analyze bin/ public/ src/ --ruleset .phpmd.dist.xml --format sarif --reportfile-sarif phpmd-results.sarif --no-progress

      - name: Upload Analysis Results
        # Upload the results even if PHPMD found violations (and therefore failed).
        if: ${{ !cancelled() && hashFiles('phpmd-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: phpmd-results.sarif
          category: phpmd
          wait-for-processing: true
